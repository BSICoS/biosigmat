name: Update Biosiglib Pin

on:
  workflow_dispatch:
    inputs:
      biosiglib_commit:
        description: "Biosiglib commit SHA"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  propagate:
    runs-on: ubuntu-latest
    env:
      BIOSIGLIB_COMMIT: ${{ inputs.biosiglib_commit }}
      BIOSIGLIB_ROOT: ${{ github.workspace }}/biosiglib

    steps:
      - name: Validate propagation inputs
        id: propagation-inputs
        shell: bash
        run: |
          if [[ ! "$BIOSIGLIB_COMMIT" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "Biosiglib commit must be a 40-character SHA: $BIOSIGLIB_COMMIT" >&2
            exit 1
          fi
          normalized_commit="$(echo "$BIOSIGLIB_COMMIT" | tr '[:upper:]' '[:lower:]')"
          echo "BIOSIGLIB_COMMIT=$normalized_commit" >> "$GITHUB_ENV"
          echo "biosiglib_commit=$normalized_commit" >> "$GITHUB_OUTPUT"
          echo "biosiglib_short_commit=${normalized_commit:0:12}" >> "$GITHUB_OUTPUT"

      - name: Check out Biosigmat
        uses: actions/checkout@v4
        with:
          path: biosigmat

      - name: Check out Biosiglib
        uses: actions/checkout@v4
        with:
          repository: BSICoS/biosiglib
          ref: ${{ steps.propagation-inputs.outputs.biosiglib_commit }}
          path: biosiglib
          fetch-depth: 0
          persist-credentials: false

      - name: Verify Biosiglib commit
        shell: bash
        run: |
          actual_commit="$(git -C biosiglib rev-parse HEAD | tr '[:upper:]' '[:lower:]')"
          if [[ "$actual_commit" != "$BIOSIGLIB_COMMIT" ]]; then
            echo "Biosiglib checkout mismatch: expected $BIOSIGLIB_COMMIT, got $actual_commit" >&2
            exit 1
          fi

      - name: Update conformance manifest
        id: manifest-update
        working-directory: biosigmat
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          path = Path("conformance.json")
          manifest = json.loads(path.read_text(encoding="utf-8"))
          commit = os.environ["BIOSIGLIB_COMMIT"].lower()

          manifest["biosiglib"]["commit"] = commit
          manifest["$schema"] = re.sub(
              r"/[0-9a-fA-F]{40}/",
              f"/{commit}/",
              manifest["$schema"],
              count=1,
          )
          path.write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          PY
          git diff -- conformance.json

      - name: Detect manifest change
        id: manifest-change
        working-directory: biosigmat
        shell: bash
        run: |
          if git diff --quiet -- conformance.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "conformance.json already pins $BIOSIGLIB_COMMIT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: biosiglib/requirements-dev.txt

      - name: Install Biosiglib validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r biosiglib/requirements-dev.txt

      - name: Validate conformance manifest
        working-directory: biosigmat
        run: python ../biosiglib/tools/validate_specs.py --manifest conformance.json

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v2
        with:
          release: R2025a
          cache: true
          products: |
            MATLAB
            Signal_Processing_Toolbox
            Curve_Fitting_Toolbox

      - name: Run full MATLAB suite
        uses: matlab-actions/run-command@v2
        with:
          command: cd('biosigmat'); addpath('scripts/local'); runTests

      - name: Check whitespace
        working-directory: biosigmat
        run: git diff --check

      - name: Open propagation pull request
        if: steps.manifest-change.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          path: biosigmat
          add-paths: conformance.json
          commit-message: Pin Biosiglib ${{ steps.propagation-inputs.outputs.biosiglib_short_commit }}
          branch: chore/biosiglib-${{ steps.propagation-inputs.outputs.biosiglib_short_commit }}
          delete-branch: true
          base: main
          title: Pin Biosiglib ${{ steps.propagation-inputs.outputs.biosiglib_short_commit }}
          body: |
            Updates the Biosiglib conformance pin used by Biosigmat.

            - Biosiglib commit: `${{ steps.propagation-inputs.outputs.biosiglib_commit }}`
            - The manifest declares conformance with every specification in that commit.
            - Conformance is verified by this workflow run and the pull request checks.
            - Shared fixtures and conformance cases were consumed from Biosiglib and were not copied into Biosigmat.
